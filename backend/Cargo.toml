[package]
name = "restaurant-kiosk-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
realtime = { path = "realtime" }
simple_rtc = { path = "simple_rtc" }
simple_stt = { path = "simple_stt" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "audio_smoke"
path = "debug/audio_smoke.rs"

[dev-dependencies]
audiopus = "0.2"
hound = "3.5"
